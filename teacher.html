<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>天文闖關老師統計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#172033; --ink2:#3D4861; --muted:#646E83; --line:#D9DEE8; --soft:#E9EDF4;
  --accent:#2C4C9C; --accent-soft:#E3E9F7; --gold:#95600F; --gold-soft:#F6EBD6; --warn:#A33A2A; --warn-soft:#F6E1DC; --good:#2F6B3A; --good-soft:#DFEFE1;
  --paper:#FFFFFF; --paper-line:#D9DEE8;
  --pen-k:#1B2233; --pen-r:#D23A2E; --pen-b:#2458D6; --pen-h:rgba(255,205,0,.42);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1422; --surface:#151C2E; --ink:#E4E8F2; --ink2:#BCC4D6; --muted:#8C96AC; --line:#283149; --soft:#1B2338;
    --accent:#93AEF0; --accent-soft:#1D2A4A; --gold:#E3B062; --gold-soft:#33291A; --warn:#EE8B78; --warn-soft:#3A2220; --good:#86C58F; --good-soft:#1D3322;
    --paper:#FFFFFF; --paper-line:#3A4460;
    --pen-k:#EEF1F8; --pen-r:#FF8373; --pen-b:#8DB0FF; --pen-h:rgba(255,214,90,.34);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1422; --surface:#151C2E; --ink:#E4E8F2; --ink2:#BCC4D6; --muted:#8C96AC; --line:#283149; --soft:#1B2338;
  --accent:#93AEF0; --accent-soft:#1D2A4A; --gold:#E3B062; --gold-soft:#33291A; --warn:#EE8B78; --warn-soft:#3A2220; --good:#86C58F; --good-soft:#1D3322;
  --paper:#FFFFFF; --paper-line:#3A4460;
  --pen-k:#EEF1F8; --pen-r:#FF8373; --pen-b:#8DB0FF; --pen-h:rgba(255,214,90,.34);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.7;padding-inline:16px;padding-block:0 80px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,40px);font-weight:800}
h2{font-size:clamp(21px,3.2vw,26px);font-weight:800}
h3{font-size:18px;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{padding-block:36px 20px;display:grid;gap:12px}
.lede{color:var(--ink2);max-width:64ch}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px 0}
nav.tabs .in{max-width:860px;margin:0 auto;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{font:inherit;font-size:14.5px;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink2);padding:8px 12px 10px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
section.tab{padding-block:24px 8px;display:grid;gap:20px}

/* rounds */
.rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.rd{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:2px;color:var(--ink)}
.rd .no{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rd b{font-size:16px}
.rd .lv{display:flex;gap:3px;margin-top:4px}
.rd .lv i{width:14px;height:5px;border-radius:2px;background:var(--line)}
.rd .lv i.on{background:var(--accent)}
.rd .meta{font-size:12.5px;color:var(--muted)}
.rd .done{font-size:12.5px;color:var(--good);font-weight:700}
.rd.locked{opacity:.6}
.rd.locked b::after{content:" 🔒";font-size:13px}
.rd[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.fld{display:inline-flex;align-items:center;gap:8px;font-weight:500}
input[type="number"],input[type="text"],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type="number"]{width:90px;font-family:var(--mono)}
textarea{width:100%;min-height:160px;font-family:var(--mono);font-size:13px;line-height:1.6}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:9px 18px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent);font-weight:500;padding:6px 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13.5px;color:var(--muted)}
.warn{color:var(--warn)}

/* question */
.qc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;scroll-margin-top:60px}
.qh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.qno{font-family:var(--mono);font-weight:500;background:var(--ink);color:var(--surface);border-radius:6px;padding:0 8px;font-size:13.5px}
.src{font-size:13px;color:var(--muted)}
.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--ink2)}
.paper{background:var(--paper);border-radius:8px;border:1px solid var(--paper-line);padding:8px;overflow-x:auto}
.paper img{display:block;width:100%;max-width:740px;height:auto;margin:0 auto}
details.stem summary{cursor:pointer;font-size:13.5px;color:var(--accent)}
details.stem[open] summary{margin-bottom:8px}
.stext{font-size:16px;color:var(--ink)}
.stext ol{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:grid;place-items:center;min-width:46px;height:40px;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--mono);font-weight:500;font-size:16px;cursor:pointer;background:var(--bg);color:var(--ink)}
.opt input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.opt input:disabled + span{cursor:default}
.opt.right span{border-color:var(--good);box-shadow:0 0 0 2px var(--good) inset}
.fb{border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:14.5px;color:var(--ink2)}
.fb.ok{background:var(--good-soft)} .fb.part{background:var(--gold-soft)} .fb.no{background:var(--warn-soft)}
.fb .v{font-weight:700;color:var(--ink)}
.fb .trap{font-size:13.5px}

.submitbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);margin-inline:-16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.submitbar .in{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* ink: handwriting layer on each question */
.paper{position:relative;--pen-k:#1B2233; --pen-r:#D23A2E; --pen-b:#2458D6; --pen-h:rgba(255,205,0,.42);}
.ink{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.inkcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:crosshair}
body.finger .inkcv{touch-action:none}
.stext.ink{border:1px dashed var(--line);border-radius:8px;padding:10px 12px 0}
/* blank scratch space under each question, part of the same drawing surface */
.scratch{height:calc(var(--sp,1) * 240px);margin-top:10px;border-top:1px dashed #C9D0DD;position:relative}
.stext .scratch{border-top-color:var(--line);margin-inline:-12px}
.scratch span{position:absolute;top:6px;left:10px;font-size:12px;color:#8C96AC;pointer-events:none}
.morespace{justify-self:start;font:inherit;font-size:13px;background:none;border:1px dashed var(--line);border-radius:8px;color:var(--ink2);padding:6px 12px;cursor:pointer}
.inkclr{margin-left:auto;font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 2px}
.refnote{font-size:13.5px;color:var(--ink2);background:var(--gold-soft);border-radius:8px;padding:6px 10px}
.tools{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tl{font:inherit;font-size:11.5px;line-height:1.1;display:inline-grid;justify-items:center;align-content:center;gap:2px;min-width:46px;height:46px;padding:3px 6px;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink2);cursor:pointer}
.tl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tl[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tl:disabled{opacity:.4;cursor:default}
.sw{width:30px;height:30px;margin:0 3px;border-radius:50%;border:2px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.tsep{width:1px;height:30px;background:var(--line);margin-inline:4px}
.subgrp{display:flex;gap:10px;align-items:center;margin-left:auto}

.sent{color:var(--good);font-weight:700}
.dot.ans{width:auto;min-width:28px;padding:0 4px;position:relative}
.dot.ink::after{content:"✎";position:absolute;top:-7px;right:-5px;font-size:11px;color:var(--accent)}
td.ord{font-size:12px;color:var(--muted);white-space:nowrap}
/* wide statistics tables scroll inside their panel instead of widening the page on phones */
.panel,.panel>*,#stats{min-width:0}
td.nw{white-space:nowrap}
table.stu .dots{min-width:300px}
.result{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.score{font-family:var(--mono);font-size:44px;font-weight:500;line-height:1}
.score small{font-size:18px;color:var(--muted)}
.code{font-family:var(--mono);font-size:14px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;word-break:break-all;user-select:all}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.dot{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--ink)}
.dot.ok{background:var(--good-soft);color:var(--good)} .dot.part{background:var(--gold-soft);color:var(--gold)} .dot.no{background:var(--warn-soft);color:var(--warn)}
.dots{display:flex;flex-wrap:wrap;gap:5px}

.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--ink2);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--soft);min-width:80px;overflow:hidden}
.bar i{display:block;height:100%}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:grid;gap:4px}
footer a{color:var(--accent);word-break:break-all}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
<header class="top">
  <span class="eyebrow">老師用</span>
  <h1>天文闖關 · 老師統計</h1>
  <p class="lede">輸入老師密碼就能看到全班成績，這支手機會記住密碼，下次打開會自動載入。</p>
</header>

<section class="tab" id="teacher">
  <div class="panel">
    <h2>全班成績統計</h2>
    <p class="lede">學生交卷時，成績會自動寫進你的 Google 試算表。這裡讀取試算表，整理出每一題的答對率、常見錯誤和作答習慣。</p>
    <div class="row"><label class="fld" for="tkey">老師密碼</label><input type="password" id="tkey" autocomplete="current-password" style="width:180px"><button class="btn" id="calc">載入最新成績</button><button class="btn ghost" id="demo">看範例資料</button></div>
    <label class="fld" style="font-weight:400"><input type="checkbox" id="firstonly" checked> 每位學生只算第一次作答（最能反映真實程度）</label>
    <label class="fld" style="font-weight:400"><input type="checkbox" id="showtest"> 顯示測試資料（座號 TA）</label>
    <p class="hint" id="calcmsg"></p>
  </div>
  <div id="stats" style="display:grid;gap:16px"></div>
</section>

<footer>
  <span>題目與答案：<a href="https://www.ceec.edu.tw/xmfile?xsmsid=0J052424829869345634">大考中心・學測歷屆試題</a>；標示「自編」的題目為講義自編練習題。</span>
  <span>完整詳解與題型歸納請看天文衝刺講義。</span>
</footer>
</div>

<script>
const Q=[];
const SOL={};Q.forEach(q=>{SOL[q.id]=q});
const STEMS={'110-63':'110-g63','112-41':'112-g41','112-42':'112-g41','112-43':'112-g41','113-54':'113-g54','113-55':'113-g54','114-22':'114-g22','114-23':'114-g22','115-51':'115-g50','110-64':'110-g63'};
/* questions that say 承上題 but whose previous item is in another round */
const REFNOTE={'110-64':'「承上題」指 110 學測第 63 題（在第 3 回），兩題共用上方題組引文的表 2，本題只要看表 2 就能作答。'};
/* multi-select items (應選 n 項) and option counts */
const MULTI={'108-18':5,'108-20':6,'109-33':5,'109-34':5,'111-28':5,'111-30':5,'112-5':5,'113-33':5,'113-54':5,'114-10':5,'114-11':5,'114-23':5};
const NOPT={'108-20':6};
const SELF={};
const ROUNDS=[
 {name:'暖身',lv:1,ids:['108-1','109-33','110-20','110-64','111-28','112-41','112-42','114-10','114-11','115-1']},
 {name:'基礎',lv:2,ids:['113-33','115-2','115-13','115-51','115-56','109-62','112-43','114-12','113-54','S4']},
 {name:'觀念',lv:3,ids:['S7','S10','108-3','110-63','110-66','111-31','111-33','S1','S3']},
 {name:'應用',lv:4,ids:['109-6','114-22','115-3','114-23','S6','S9','111-30','108-20','110-22']},
 {name:'挑戰',lv:5,ids:['108-18','109-34','112-5','113-55','S2','S5','S8','114-13','114-18','110-56']}
];
/* 'all' = 總表 (every round + teacher tab); 'locked' = published site; 'teacher' = 老師統計 */
const MODE=/*MODE*/{kind:'teacher',locked:true}/*/MODE*/;
/* Google Apps Script web-app URL that writes submissions into the teacher's sheet (see Google試算表程式.gs) */
const SUBMIT_URL='https://script.google.com/macros/s/AKfycbw8Qd6AknqHgxBaQqe5m7lWvQFVYJkZLFDJCpBWNKAoRt59NlkKlaRuNM9aQvJHwi0dww/exec';
const LETTERS='ABCDEF';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function meta(id){
  if(SELF[id]){const s=SELF[id];return {id,self:true,ans:s.ans,n:s.opts.length,multi:false,sol:s.sol,trap:s.trap,sk:s.sk}}
  const q=SOL[id];return {id,self:false,ans:q.ans,n:NOPT[id]||5,multi:!!MULTI[id],sol:q.sol,trap:q.trap,sk:q.sk,d:q.d}
}
function grade(m,picked){ // picked string like "CE"
  if(!picked) return 0;
  if(!m.multi) return picked===m.ans?1:0;
  let k=0;for(let i=0;i<m.n;i++){const L=LETTERS[i];if(picked.includes(L)!==m.ans.includes(L))k++}
  return Math.max(0,(m.n-2*k)/m.n);
}

/* state */
let cur=0; let answers={}; let submitted=false;
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
const doneMap=load('astro-quiz-done',{});

function renderRounds(){
  if(MODE.kind==='teacher')return;
  $('#rounds').innerHTML=ROUNDS.map((r,i)=>{
    const st=SCHED&&SCHED[i+1],locked=MODE.kind==='locked'&&!(st&&st.open);
    return `<button class="rd${locked?' locked':''}" data-i="${i}" aria-pressed="${i===cur}">
    <span class="no">第 ${i+1} 回</span><b>${r.name}</b>
    <span class="lv" aria-label="難度 ${r.lv} / 5">${[1,2,3,4,5].map(k=>`<i class="${k<=r.lv?'on':''}"></i>`).join('')}</span>
    <span class="meta">${locked?(st?`${when(st.opens)} 開放`:'尚未開放'):`${r.ids.length||r.n} 題`}</span>${doneMap[i]!=null?`<span class="done">已完成 ${doneMap[i]} 分</span>`:''}</button>`}).join('');
  document.querySelectorAll('.rd').forEach(b=>b.addEventListener('click',()=>openRound(+b.dataset.i)));
}
const SPACE=load('astro-quiz-space',{}); // question id -> scratch height in 240px steps
const scratch=id=>`<div class="scratch" style="--sp:${SPACE[id]||1}"><span>草稿區</span></div>`;
function qHTML(id,idx){
  const m=meta(id);
  let body='';
  if(m.self){const s=SELF[id];body=`<div class="stext ink" data-k="${id}"><p>${esc(s.text)}</p><ol>${s.opts.map((o,i)=>`<li>(${LETTERS[i]}) ${esc(o)}</li>`).join('')}</ol>${scratch(id)}</div>`}
  else{const st=STEMS[id];body=(st?`<details class="stem" open><summary>題組引文</summary><div class="paper ink" data-k="${id}~stem"><img src="${imgSrc(st)}" alt="題組引文" loading="lazy"></div></details>`:'')+`<div class="paper ink" data-k="${id}"><img src="${imgSrc(id)}" alt="${id.slice(0,3)} 年學測第 ${id.slice(4)} 題" loading="lazy">${scratch(id)}</div>`}
  const type=m.multi?'checkbox':'radio';
  const opts=Array.from({length:m.n},(_,i)=>LETTERS[i]).map(L=>`<label class="opt"><input type="${type}" name="a-${id}" value="${L}" id="o-${id}-${L}"><span>${L}</span></label>`).join('');
  return `<article class="qc" id="c-${id}">
    <div class="qh"><span class="qno">${idx+1}</span><span class="src">${m.self?'自編練習':id.slice(0,3)+' 學測 · 第 '+id.slice(4)+' 題'}</span><span class="pill">${m.multi?'多選':'單選'}</span><button class="inkclr" data-id="${id}" hidden>清除筆跡</button></div>
    ${REFNOTE[id]?`<p class="refnote">${REFNOTE[id]}</p>`:''}
    ${body}
    <button class="morespace" data-id="${id}"${(SPACE[id]||1)>=5?' hidden':''}>＋ 加大草稿區</button>
    <div class="opts" role="group" aria-label="第 ${idx+1} 題選項">${opts}</div>
    <div class="fbwrap"></div></article>`;
}
function startRound(){
  submitted=false;
  answers=load('astro-quiz-draft-'+cur,{});
  habit=Object.assign({secs:{},changes:{},order:[],total:0},load('astro-quiz-habit-'+cur,{}));
  renderRounds();
  const r=ROUNDS[cur];
  $('#qlist').innerHTML=r.ids.map(qHTML).join('')+`<div class="submitbar"><div class="in">${toolsHTML()}<div class="subgrp"><span class="hint" id="prog"></span><button class="btn" id="submit">交卷</button></div></div></div>`;
  mountInk();
  r.ids.forEach(id=>{(answers[id]||'').split('').forEach(L=>{const el=document.getElementById('o-'+id+'-'+L);if(el)el.checked=true})});
  $('#submit').addEventListener('click',submit);
  $('#result').hidden=true;$('#result').innerHTML='';
  // a submitted round stays graded (answers, feedback, score) until the student chooses to retake it
  const sub=load('astro-quiz-sub-'+cur,null);

function onPick(e){

// Apps Script sometimes answers the first request after a quiet spell with an HTML error page; retry once
async function gasJSON(url,opts){
  for(let i=0;;i++){
    const t=await (await fetch(url,opts)).text();
    try{return JSON.parse(t)}catch(e){if(i)throw new Error('Google 暫時沒有回應，請稍後再試');await new Promise(r=>setTimeout(r,1500))}
  }
}
async function api(params){
  if(!SUBMIT_URL)throw new Error('老師還沒設定網址');

  if(!j.ok)throw new Error(j.error||'讀取失敗');return j;
}
async function loadSchedule(){SCHED=(await api({action:'schedule'})).rounds}
// bundle layout: 12-byte IV, then AES-GCM ciphertext with its tag (written by 產生網站檔案.js)
async function decrypt(buf,keyB64){
  const k=await crypto.subtle.importKey('raw',Uint8Array.from(atob(keyB64),c=>c.charCodeAt(0)),'AES-GCM',false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(buf,0,12)},k,new Uint8Array(buf,12));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function unlock(ri){
  if(LOADED[ri])return;
  const keys=load('astro-quiz-keys',{});
  const buf=await (await fetch(`r${ri+1}.dat`,{cache:'no-cache'})).arrayBuffer();
  let d;
  for(let tries=0;;tries++){
    if(!keys[ri+1]){keys[ri+1]=(await api({action:'key',round:ri+1})).key;store('astro-quiz-keys',keys)}
    try{d=await decrypt(buf,keys[ri+1]);break}
    catch(e){if(tries)throw new Error('題目檔無法解開');delete keys[ri+1]} // key saved from an older version: fetch it again
  }
  d.Q.forEach(q=>{SOL[q.id]=q});Object.assign(SELF,d.SELF);Object.assign(IMG,d.IMG);ROUNDS[ri].ids=d.ids;
  LOADED[ri]=true;
}

    if(!(st&&st.open))return note(st?`第 ${ri+1} 回將在 <b>${when(st.opens)}</b> 開放，到時候再回來。`:'這一回還沒開放。');
    if(!LOADED[ri]){

    }

/* sending: every submission goes to an outbox on this device first, so nothing is lost offline */
function setSend(html,retry){const m=$('#sendmsg');if(m)m.innerHTML=html;const b=$('#resend');if(b)b.hidden=!retry}
async function sendRecord(rec){
  setSend('正在整理題目上的筆跡…');
  try{rec.ink=inkImages(rec.ids)}catch(e){rec.ink={}}
  const box=load('astro-quiz-outbox',[]);box.push(rec);
  if(!store('astro-quiz-outbox',box)){rec.ink={};rec.inkDropped=true;box[box.length-1]=rec;store('astro-quiz-outbox',box)}
  flushOutbox();
}
let flushing=false;
async function flushOutbox(){
  const box=load('astro-quiz-outbox',[]);
  if(flushing||!box.length)return;
  if(!SUBMIT_URL){setSend('<span class="warn">老師還沒設定收件網址。成績已先存在這台裝置上，設定好以後再打開測驗會自動送出。</span>',false);return}
  flushing=true;setSend('正在把成績送給老師…',false);
  let last=null,fail=null;
  for(const rec of box){
    try{
      const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),60000);
      const j=await gasJSON(SUBMIT_URL,{method:'POST',body:JSON.stringify(rec),signal:ctl.signal});clearTimeout(t);
      if(!j.ok)throw new Error(j.error||'收件端錯誤');
      last={rec,j};
      const sub=load('astro-quiz-sub-'+(rec.round-1),null);if(sub&&sub.uid===rec.uid){sub.attempt=j.attempt;store('astro-quiz-sub-'+(rec.round-1),sub)}
      store('astro-quiz-outbox',load('astro-quiz-outbox',[]).filter(x=>x.uid!==rec.uid));
    }catch(e){fail=e.name==='AbortError'?new Error('連線逾時'):e instanceof TypeError?new Error('沒有連上網路'):e;break}
  }
  flushing=false;
  if(fail)setSend(`<span class="warn">還沒送出（${esc(fail.message)}）。成績已存在這台裝置上，確認有連上網路後按「重新送出」；下次打開測驗也會自動再送。</span>`,true);
  else if(last)setSend(`<span class="sent">✓ 已送到老師那裡</span>　第 ${last.rec.round} 回・第 ${last.j.attempt} 次作答${last.rec.inkDropped?'（筆跡太大，這次只送出答案）':''}`,false);
}

/* ink snapshots for the teacher: question image + strokes, one JPEG per question that has ink */
const PAPER_INK={k:'#1B2233',r:'#D23A2E',b:'#2458D6',h:'rgba(255,205,0,.42)'};
function inkImages(ids){
  const out={};
  ids.forEach(id=>{
    if(!(INK[id]||[]).length&&!(INK[id+'~stem']||[]).length)return;
    const parts=[id+'~stem',id].map(k=>SURF.get(k)).filter(s=>s&&s.w&&s.h);
    if(!parts.length)return;
    // a page opened from a local file can't export its images; fall back to ink on white
    try{out[id]=snapshot(parts,true)}catch(e){out[id]=snapshot(parts,false)}
  });
  return out;
}
function snapshot(parts,withImg){
  const W=900,gap=14,hs=parts.map(s=>Math.round(s.h*W/s.w));
  const cv=document.createElement('canvas');cv.width=W;cv.height=hs.reduce((a,b)=>a+b,0)+gap*(parts.length-1);
  const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);
  let y=0;
  parts.forEach((s,i)=>{
    const k=W/s.w;c.save();c.translate(0,y);
    const img=s.el.querySelector('img');
    if(withImg&&img&&img.naturalWidth)c.drawImage(img,img.offsetLeft*k,img.offsetTop*k,img.offsetWidth*k,img.offsetHeight*k);
    if(s.el.classList.contains('stext'))drawText(c,s.el,k);
    drawStrokes(c,INK[s.k]||[],W,key=>PAPER_INK[key]);
    c.restore();
    if(i<parts.length-1){c.fillStyle='#D9DEE8';c.fillRect(0,y+hs[i]+gap/2-1,W,2)}
    y+=hs[i]+gap;
  });
  return cv.toDataURL('image/jpeg',0.82);
}
function drawText(c,el,k){
  const base=el.getBoundingClientRect();
  el.querySelectorAll('p,li').forEach(n=>{
    const b=n.getBoundingClientRect(),cs=getComputedStyle(n);
    const fs=parseFloat(cs.fontSize)*k,lh=(parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.7)*k;
    c.font=`${fs}px ${cs.fontFamily}`;c.fillStyle='#172033';c.textBaseline='alphabetic';
    let line='',y=(b.top-base.top)*k+lh*0.72;const x=(b.left-base.left)*k,maxW=b.width*k;
    for(const ch of n.textContent){if(c.measureText(line+ch).width>maxW&&line){c.fillText(line,x,y);line='';y+=lh}line+=ch}
    if(line)c.fillText(line,x,y);
  });
}

/* teacher: reads every submission back from the Google Sheet (password-protected) */

const mmss=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
function renderStats(){
  if(!SUBS)return;
  const firstOnly=$('#firstonly').checked,showTest=$('#showtest').checked;
  const color=v=>v>=0.7?'var(--good)':v>=0.4?'var(--gold)':'var(--warn)';
  let nAll=0;const out=[];
  ROUNDS.forEach((r,ri)=>{
    const seatNo=s=>s.seat==='TA'?0:+s.seat;
    let list=(SUBS[ri+1]||[]).slice().sort((a,b)=>seatNo(a)-seatNo(b)||a.attempt-b.attempt);
    if(!showTest)list=list.filter(s=>s.seat!=='TA');
    if(firstOnly)list=list.filter(s=>s.attempt===1);
    if(!list.length)return;
    nAll+=list.length;
    const per=r.ids.map((id,qi)=>{
      const m=meta(id);let n=0,full=0,secs=0,chg=0;const wrong={};
      list.forEach(s=>{const j=s.ids.indexOf(id);if(j<0)return;n++;const p=s.answers[j];if(grade(m,p)===1)full++;else{const k=p||'未答';wrong[k]=(wrong[k]||0)+1}secs+=s.secs[j]||0;chg+=s.changes[j]||0});
      const top=Object.entries(wrong).sort((a,b)=>b[1]-a[1])[0];
      return {id,qi,m,rate:n?full/n:0,secs:n?secs/n:0,chg:n?chg/n:0,top};
    });
    const mean=Math.round(list.reduce((a,s)=>a+s.score,0)/list.length);
    const meanT=list.reduce((a,s)=>a+(s.totalSec||0),0)/list.length;
    out.push(`<div class="panel"><div class="row" style="justify-content:space-between"><h3>第 ${ri+1} 回 · ${r.name}</h3><span class="hint">${list.length} 份 · 平均 <b class="mono">${mean}</b> 分 · 平均用時 <b class="mono">${mmss(meanT)}</b></span></div>
      <div class="tblwrap"><table><thead><tr><th>題</th><th>來源</th><th>考點</th><th class="n">答對率</th><th></th><th>最多人選的錯誤答案</th><th class="n">平均用時</th><th class="n">平均改答</th></tr></thead><tbody>
      ${per.slice().sort((a,b)=>a.rate-b.rate).map(p=>`<tr><td class="mono">${p.qi+1}</td><td class="nw">${p.m.self?'自編 '+p.id.slice(1):p.id}</td><td>${esc(p.m.sk)}</td><td class="n">${Math.round(p.rate*100)}%</td><td><div class="bar"><i style="width:${p.rate*100}%;background:${color(p.rate)}"></i></div></td><td class="mono">${p.top?`${esc(p.top[0])}（${p.top[1]} 人）`:'—'}</td><td class="n">${mmss(p.secs)}</td><td class="n">${p.chg.toFixed(1)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="hint">依答對率由低到高排序，最上面幾題最需要在課堂上講解。「平均改答」是每人在這題平均換了幾次答案，數字高代表很多人猶豫。</p>
      <details open><summary class="hint" style="cursor:pointer">每位學生</summary><div class="tblwrap"><table class="stu"><thead><tr><th>座號</th><th>姓名</th><th class="n">次</th><th class="n">分數</th><th class="n">用時</th><th>各題選的答案</th><th>作答順序</th></tr></thead><tbody>
      ${list.map(s=>`<tr><td class="mono">${s.seat}</td><td class="nw">${esc(s.name)}</td><td class="n">${s.attempt}</td><td class="n">${s.score}</td><td class="n">${mmss(s.totalSec||0)}</td><td><div class="dots">${r.ids.map((id,qi)=>{const j=s.ids.indexOf(id);const p=j<0?'':s.answers[j];const g=grade(meta(id),p);const link=s.links&&s.links[id];const tip=`第 ${qi+1} 題：${p||'未答'}，${mmss(j<0?0:s.secs[j])}，改答 ${j<0?0:s.changes[j]} 次${link?'，點開看筆跡':''}`;const cls=`dot ans ${g===1?'ok':g>0?'part':'no'}${link?' ink':''}`;return link?`<a class="${cls}" href="${esc(link)}" target="_blank" rel="noopener" title="${tip}">${p||'—'}</a>`:`<span class="${cls}" title="${tip}">${p||'—'}</span>`}).join('')}</div></td><td class="mono ord">${(s.order||[]).join(' ')}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="hint">方塊依題號排列，裡面是學生選的答案（— 表示沒寫）；綠＝對、黃＝部分、紅＝錯。右上角有 ✎ 的方塊代表學生在那題畫了圖，點下去可以看筆跡。</p></details></div>`);
  });
  $('#calcmsg').innerHTML=`共 <b>${nAll}</b> 份作答${firstOnly?'（每人只算第一次）':''}${showTest?'，含測試資料':''}。`;
  $('#stats').innerHTML=out.join('')||'<p class="hint">還沒有學生交卷。</p>';
}
function demoSubs(){
  // clearly labeled fictional data for rounds 1 and 3
  let seed=3;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const names=['王小明','林怡君','陳柏翰','張雅婷','李承恩','黃詩涵','吳宥廷','劉品妤','蔡宗翰','楊子晴','許家豪','鄭語彤'];
  const subs={};
  [0,2].forEach(ri=>{const r=ROUNDS[ri];subs[ri+1]=[];names.forEach((nm,i)=>{for(let a=1;a<=(i%4===0?2:1);a++){
    const answers=r.ids.map(id=>{const m=meta(id);if(rnd()<0.6+a*0.1)return m.ans;const L=LETTERS[Math.floor(rnd()*m.n)];return m.multi?(L+(m.ans[0]!==L?m.ans[0]:'')).split('').sort().join(''):L});
    const score=Math.round(r.ids.reduce((t,id,j)=>t+grade(meta(id),answers[j]),0)/r.ids.length*100);
    const secs=r.ids.map(()=>Math.round(30+rnd()*150));
    subs[ri+1].push({seat:i+1,name:nm+'（範例）',attempt:a,score,ids:r.ids,answers,secs,changes:r.ids.map(()=>rnd()<0.2?1+Math.floor(rnd()*2):0),order:r.ids.map((_,j)=>j+1).sort(()=>rnd()-0.45),totalSec:secs.reduce((x,y)=>x+y,0),links:{}});
  }})});
  return subs;
}
$('#calc').addEventListener('click',fetchSubs);
$('#demo').addEventListener('click',()=>{if(MODE.locked&&!ANSWERS_LOADED){$('#calcmsg').innerHTML='<span class="warn">請先輸入密碼登入，才能看範例資料。</span>';return}SUBS=demoSubs();renderStats()});
$('#firstonly').addEventListener('change',renderStats);
$('#showtest').addEventListener('change',renderStats);
$('#tkey').value=load('astro-quiz-tkey','');
$('#tkey').addEventListener('keydown',e=>{if(e.key==='Enter')fetchSubs()});
if(MODE.kind==='teacher'&&$('#tkey').value)fetchSubs(); // phone bookmark: saved password logs straight in

/* tabs */
if(MODE.kind==='all'){
  const TABS=['quiz','teacher'];
  const show=id=>{if(!TABS.includes(id))id='quiz';TABS.forEach(t=>{document.getElementById(t).hidden=t!==id;document.getElementById('tb-'+t).setAttribute('aria-selected',t===id)})};
  TABS.forEach(t=>document.getElementById('tb-'+t).addEventListener('click',()=>{show(t);if(history.replaceState)history.replaceState(null,'','#'+t)}));
  const h=(location.hash||'').slice(1);
  if(/^r[1-5]$/.test(h))cur=+h[1]-1;
  show(h==='teacher'?'teacher':'quiz');
}
if(MODE.kind!=='teacher'){
  const sv=load('astro-quiz-seat',null);if(sv)$('#seat').value=sv;
  $('#sname').value=load('astro-quiz-name','');
  $('#qlist').addEventListener('change',onPick);
  if(MODE.kind==='locked')bootLocked();else startRound();
  flushOutbox(); // anything left from an earlier offline submit
}
